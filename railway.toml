[build]
builder = "RAILPACK"
buildCommand = "pnpm exec playwright install --with-deps chromium && pnpm build"

[deploy]
preDeployCommand = "pnpm migrate:prod"
startCommand = "pnpm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
